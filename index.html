<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Information Sheets</title>
<style>
  :root { --ink:#1a2332; --muted:#5b6472; --line:#e3e8ef; --bg:#f6f8fb; --accent:#1e6fb8; --card:#ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.7rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); font-size: 1.02rem; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 24px; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 18px; text-decoration: none; color: var(--ink);
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(30,111,184,.10); }
  .card-title { font-weight: 600; font-size: 1.05rem; }
  .card-go { color: var(--accent); font-size: .92rem; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 1.05rem; margin-top: 24px; }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Patient Information Sheets</h1>
      <p class="lede">Easy-to-read guides about your health, your treatment, and how to look after yourself. Pick a topic below.</p>
    </header>
    <div class="grid">
    <a class="card" href="T2DM.html">
      <span class="card-title">Type 2 diabetes ??your guide</span>
      <span class="card-go">Read &rarr;</span>
    </a>
    </div>
    <footer>
      These sheets give general information only. For advice about your own health, please speak with your doctor.
    </footer>
  </main>
</body>
</html>
